<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>سامانه آموزش و امتیاز پرسنل</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#5d6b82;--line:#dbe3ef;--pri:#2457d6;--pri-t:#fff;--ok:#157347;--warn:#b45309;--bad:#b42318;--soft:#eef3fb;--general:#0369a1;--semi:#b45309;--specific:#7c3aed;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1521;--card:#171f2f;--text:#e8edf6;--muted:#9aa8bf;--line:#2a3550;--pri:#5b8cff;--pri-t:#0b1020;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--soft:#1e2840;--general:#38bdf8;--semi:#fbbf24;--specific:#c4b5fd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.8 Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:linear-gradient(135deg,#1e3a8a,#2457d6);color:#fff;padding:14px 16px}
header.top h1{margin:0;font-size:1.2rem}header.top small,header.top #status{color:#fff;opacity:.9}
#status{font-size:.8rem;opacity:.95;margin-top:4px}
nav{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px 10px}
nav button{border:0;background:none;padding:8px 14px;border-radius:10px;white-space:nowrap;cursor:pointer;color:var(--muted)}
nav button.on{background:var(--pri);color:var(--pri-t)}
main{max-width:1180px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 10px}h3{margin:0}h4{margin:14px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.m{background:var(--soft);border-radius:12px;padding:10px}.m b{display:block;font-size:1.3rem}.m span{color:var(--muted);font-size:.85rem}
.m.w b{color:var(--warn)}.m.b b{color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 13px;cursor:pointer}
.btn.pri{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}.btn.sm{padding:3px 9px;font-size:.85rem}
.btn.on{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.bar .sp{flex:1}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--card);width:100%}
.bar input,.bar select{width:auto;min-width:130px}
label{display:block;margin:8px 0;font-size:.9rem;color:var(--muted)}label input,label select,label textarea{margin-top:3px;color:var(--text)}
label.ck{display:flex;gap:8px;align-items:center}label.ck input{width:auto}
.inl{display:flex;gap:6px}
.tw{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}th{background:var(--soft);font-weight:600;font-size:.85rem}
td.l,th.l{text-align:right}tr.off{opacity:.55}.acts{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.bd{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;border:1px solid currentColor;white-space:nowrap;margin:1px}
.bd.general{color:var(--general)}.bd.semi{color:var(--semi)}.bd.specific{color:var(--specific)}.bd.man{color:var(--muted)}.bd.ok{color:var(--ok)}.bd.warn{color:var(--warn)}.bd.bad{color:var(--bad)}
.muted,small,.hint{color:var(--muted)}.hint{font-size:.85rem}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;border-inline-start:5px solid var(--line)}
.row.p{border-inline-start-color:var(--ok);background:color-mix(in srgb,var(--ok) 7%,transparent)}.row.a{border-inline-start-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent)}
.who small{display:block}.seg{display:flex;gap:4px;align-items:center}.seg button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 14px;cursor:pointer;min-width:60px}
.seg button.on.p{background:var(--ok);color:#fff;border-color:var(--ok)}.seg button.on.a{background:var(--bad);color:#fff;border-color:var(--bad)}
.note{grid-column:1/-1;font-size:.82rem}.warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.banner{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid var(--warn);border-radius:12px;padding:10px;margin-bottom:12px}
.bars div.b{display:grid;grid-template-columns:110px 1fr 50px;gap:8px;align-items:center;margin:5px 0}.bars i{display:block;height:12px;border-radius:6px;background:var(--pri)}
.ov{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:92vh;display:flex;flex-direction:column}.modal.wide{max-width:900px}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal .x{border:0;background:none;font-size:1.5rem;cursor:pointer}.mb{padding:10px 16px;overflow:auto}
.modal footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}.err{color:var(--bad);padding:0 16px 10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;display:none;max-width:90%}
#toast.bad{background:var(--bad)}
footer.ft{text-align:center;color:var(--muted);padding:18px;font-size:.85rem}
.pt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.empty{text-align:center;padding:30px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{text-align:center;font-weight:600;font-size:.8rem;color:var(--muted)}
.cal .d{min-height:84px;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:.8rem;overflow:hidden}.cal .d.e{border:0}.cal .d.fr{background:color-mix(in srgb,var(--bad) 6%,transparent)}.cal .d.td{outline:2px solid var(--pri)}
.chip{display:block;background:var(--soft);border:0;border-radius:6px;padding:1px 5px;margin-top:2px;cursor:pointer;font-size:.74rem;width:100%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh,.certs{display:none}
@media(max-width:640px){main{padding:10px}.bars div.b{grid-template-columns:80px 1fr 40px}.seg button{padding:9px 12px}.cal .d{min-height:58px;font-size:.7rem}.chip{font-size:.62rem}}
@media(max-width:640px){
.tw table{min-width:0}.tw table tr:first-child{display:none}
.tw table tr{display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:4px 8px}
.tw table td{display:flex;justify-content:space-between;gap:8px;text-align:right;border:0;padding:3px 0}
.tw table td::before{content:attr(data-l);color:var(--muted);font-size:.78rem;flex:none}
.tw table td[colspan]::before,.tw table td[data-l=""]::before{content:none}
.tw table .acts{justify-content:flex-start}
}
@media print{body{background:#fff;color:#000}header.top,nav,.bar,.acts,.seg,.noprint,footer.ft,#toast{display:none!important}.card{border:0;padding:0}table{min-width:0;font-size:9pt}.tw{overflow:visible}@page{size:A4 landscape;margin:10mm}
.lh{display:block;text-align:center;border-bottom:2px solid #000;margin-bottom:10px;padding-bottom:6px}.lh b{font-size:14pt}
body.pc>*:not(.certs){display:none!important}body.pc .certs{display:block}
.cert{page-break-after:always;height:182mm;border:6px double #1e3a8a;padding:16mm;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:10mm;color:#000;font-size:15pt;line-height:2.2}
.cert h1{font-size:26pt;margin:0;color:#1e3a8a}.cert h2{font-size:16pt;margin:0}.cert h3{font-size:13pt;margin:0}.cert .sg{align-self:flex-start;margin-top:12mm;font-size:12pt}}
</style>
</head>
<body>
<header class="top"><h1>سامانه مدیریت آموزش و امتیاز پرسنل <small>نسخه ۴٫۲</small></h1><small id="unitname"></small><div id="status" class="noprint"></div></header>
<nav id="nav" class="noprint"></nav>
<main id="app"></main>
<footer class="ft">تهیه و تنظیم: <b>واحد آموزش بخش داخلی مردان</b></footer>
<div id="toast"></div>
<noscript>برای استفاده از این سامانه جاوااسکریپت باید فعال باشد.</noscript>
<script>
(()=>{
'use strict';
const KEY='personnelTraining_v3',PREV='personnelTraining_v3_prev',OLD='personnelClassScores_v2';
const TYPES={general:'عمومی',semi:'نیمه‌تخصصی',specific:'تخصصی'},TK=Object.keys(TYPES);
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const $=s=>document.querySelector(s);
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FA='۰۱۲۳۴۵۶۷۸۹',AR='٠١٢٣٤٥٦٧٨٩';
const fa=v=>String(v).replace(/\d/g,d=>FA[d]);
const lat=s=>String(s??'').replace(/[۰-۹]/g,d=>FA.indexOf(d)).replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/٫/g,'.');
const num=v=>{const t=lat(v).trim();if(t==='')return NaN;const x=Number(t);return Number.isFinite(x)?x:NaN};
const fmt=v=>fa(String(Math.round(v*100)/100));
const norm=s=>String(s??'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').trim().toLocaleLowerCase('fa');
const okScore=v=>v>=0&&v<=1000;
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- تقویم شمسی ---------- */
const div=(a,b)=>~~(a/b),mod=(a,b)=>a-~~(a/b)*b;
const BRK=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){
 const bl=BRK.length,gy=jy+621;let leapJ=-14,jp=BRK[0],jm,jump=0,leap,leapG,march,n,i;
 if(jy<jp||jy>=BRK[bl-1])throw new Error('year');
 for(i=1;i<bl;i++){jm=BRK[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);jp=jm}
 n=jy-jp;leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);
 if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
 leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
 if(jump-n<6)n=n-jump+div(jump+4,33)*33;
 leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;
 return{leap,gy,march};
}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308,gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1;return{gy:div(j,1461)-100100+div(8-gm,6),gm,gd}}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){const gy=d2g(jdn).gy;let jy=gy-621;const r=jalCal(jy),f=g2d(gy,3,r.march);let k=jdn-f,jm,jd;
 if(k>=0){if(k<=185){return{jy,jm:1+div(k,31),jd:mod(k,31)+1}}k-=186}else{jy-=1;k+=179;if(r.leap===1)k+=1}
 return{jy,jm:7+div(k,30),jd:mod(k,30)+1}}
const monthLen=(y,m)=>m<=6?31:m<=11?30:(jalCal(y).leap===0?30:29);
const pad2=n=>String(n).padStart(2,'0');
const toJdn=s=>{const [y,m,d]=s.split('/').map(Number);return j2d(y,m,d)};
const fromJdn=j=>{const r=d2j(j);return r.jy+'/'+pad2(r.jm)+'/'+pad2(r.jd)};
const addDays=(s,n)=>fromJdn(toJdn(s)+n);
function addMonths(s,n){const [y,m,d]=s.split('/').map(Number),t=y*12+(m-1)+n,ny=div(t,12),nm=mod(t,12)+1;return ny+'/'+pad2(nm)+'/'+pad2(Math.min(d,monthLen(ny,nm)))}
const wdIdx=j=>mod(j+2,7);
function normDate(s){
 s=lat(s).trim();if(!s)return '';
 const m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);if(!m)return null;
 const y=+m[1],mo=+m[2],d=+m[3];
 if(y<1300||y>1500||mo<1||mo>12||d<1||d>monthLen(y,mo))return null;
 return y+'/'+pad2(mo)+'/'+pad2(d);
}
const showDate=d=>d?fa(d):'بدون تاریخ';
function today(){try{const p=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric',timeZone:'Asia/Tehran'}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t)?.value;return normDate(g('year')+'/'+g('month')+'/'+g('day'))||''}catch(e){return ''}}

/* ---------- داده ---------- */
const DEFSET={unit:'واحد آموزش بخش داخلی مردان',org:'',operator:'',signer:'',signerTitle:'مسئول آموزش',lowRate:50};
const mkSnap=c=>({type:c.type,score:c.score,rules:clone(c.rules||{}),valid:c.valid||0,hours:c.hours||0});
let db,saveErr=false;
const cls=id=>db.classes.find(c=>c.id===id),stf=id=>db.staff.find(p=>p.id===id),ses=id=>db.sessions.find(s=>s.id===id),grp=id=>db.groups.find(g=>g.id===id);
const gname=id=>grp(id)?.name||'بدون گروه';
const sname=s=>cls(s.classId)?.name||'؟';
const resolve=(s,gid)=>{const gr=s.snap.rules?.[gid];return{t:gr&&gr.type?gr.type:s.snap.type,v:+(gr&&gr.score!==''&&gr.score!=null?gr.score:s.snap.score)}};
const rec=(sid,pid)=>db.att[sid]?.[pid];
const reqOf=(c,gid)=>{const r=c.rules?.[gid]?.req;return r==='y'?true:r==='n'?false:!!c.req};
function logE(act,txt){(db.log??=[]).push({t:new Date().toISOString(),who:db.settings.operator||'',act,txt});if(db.log.length>3000)db.log.splice(0,db.log.length-3000)}
function seed(){
 const g=[['پرستار',30],['کمک‌پرستار',20],['ماما',30],['سایر',0]].map(([name,min])=>({id:uid(),name,min}));
 const [pr,kp,ma]=g;
 const c1={id:uid(),name:'CPR',code:'CLS-001',type:'specific',score:20,rules:{[kp.id]:{type:'general',score:10,req:''},[ma.id]:{type:'semi',score:15,req:''}},active:true,note:'',req:true,valid:12};
 const c2={id:uid(),name:'تنفس',code:'CLS-002',type:'semi',score:15,rules:{[pr.id]:{type:'specific',score:'',req:''}},active:true,note:'',req:false,valid:0};
 const c3={id:uid(),name:'اخلاق',code:'CLS-003',type:'general',score:10,rules:{},active:true,note:'',req:false,valid:0};
 const d=today();
 return{version:4,groups:g,classes:[c1,c2,c3],sessions:[c1,c2,c3].map(c=>({id:uid(),classId:c.id,date:d,instructor:'',note:'',snap:mkSnap(c)})),
  staff:[['علی',pr],['محمد',kp],['حسن',ma],['حسین',pr]].map(([name,gg])=>({id:uid(),name,code:'',groupId:gg.id,active:true})),att:{},log:[],settings:{...DEFSET},meta:{sample:true,lastBackup:'',dirty:0}};
}
function normalizeDb(raw){
 if(!raw||typeof raw!=='object'||!Array.isArray(raw.classes)||!Array.isArray(raw.sessions)||!Array.isArray(raw.staff))throw new Error('ساختار فایل معتبر نیست.');
 const v=raw.version;
 if(v===3||v===4)return fromV3(raw,[]);
 if(v===undefined||v===2){const res=fromV2(raw,[]);(res.warnings.conf||[]).forEach(t=>res.db.log.push({t:new Date().toISOString(),who:'سیستم',act:'تعارض',txt:t}));return res}
 throw new Error('شماره نسخه پشتیبان ('+String(v)+') ناشناخته است و فایل رد شد؛ برای بازیابی از نسخه‌ی جدیدتر برنامه استفاده کنید.');
}
function cleanRules(r,gids){const o={};for(const [gid,v] of Object.entries(r||{})){if(!gids.has(gid))continue;const t=TK.includes(v?.type)?v.type:'';let s=(v?.score===''||v?.score==null)?'':num(v.score);if(s!==''&&!okScore(s))s='';const rq=v?.req==='y'||v?.req==='n'?v.req:'';if(t||s!==''||rq)o[gid]={type:t,score:s,req:rq}}return o}
const validNum=v=>{const x=num(v);return Number.isFinite(x)&&x>=0&&x<=120?Math.round(x):0};
const hrs=v=>{const x=num(v);return Number.isFinite(x)&&x>=0&&x<=1000?x:0};
const hasHours=()=>db.classes.some(c=>c.hours>0);
const todayC=()=>{const n=Date.now();if(!todayC.c||n-todayC.t>30000){todayC.c=today();todayC.t=n}return todayC.c};
const effStatus=s=>{if(s.status==='canceled')return 'canceled';const t=todayC();return s.date&&t&&s.date>t?'planned':'held'};
const isHeld=s=>effStatus(s)==='held';
const STS={held:'برگزارشده',planned:'برنامه‌ریزی‌شده',canceled:'لغوشده'};
const gOf=(r,pid,f)=>f&&f.gmode==='cur'?(stf(pid)?.groupId||''):(r.s==='p'?r.g:(r.g||stf(pid)?.groupId||''));
function blocks(x,s){ // آیا حضور قبلی x مانع امتیاز دوباره در s است؟
 const [a,b]=(!x.date||!s.date||x.date<=s.date)?[x,s]:[s,x],v=a.snap?.valid||0;
 if(!v||!a.date||!b.date)return true;return b.date<=addMonths(a.date,v);
}
function fromV3(r,w){
 const groups=[],gids=new Set();
 for(const g of r.groups||[]){const name=String(g?.name??'').trim(),id=String(g?.id??'');if(!name||!id||gids.has(id))throw new Error('گروه شغلی نامعتبر یا تکراری در فایل وجود دارد.');const mn=num(g.min);gids.add(id);groups.push({id,name,min:okScore(mn)?mn:0})}
 const classes=[],cids=new Set(),names=new Set(),codes=new Set();
 for(const c of r.classes){
  const id=String(c?.id??''),name=String(c?.name??'').trim(),code=String(c?.code??'').trim(),score=num(c?.score);
  if(!id||cids.has(id))throw new Error('شناسه کلاس نامعتبر یا تکراری است.');
  if(!name)throw new Error('کلاسی بدون نام در فایل وجود دارد.');
  if(names.has(norm(name)))throw new Error('نام کلاس «'+name+'» تکراری است.');
  if(!code||codes.has(norm(code)))throw new Error('کد کلاس «'+name+'» خالی یا تکراری است.');
  if(!okScore(score))throw new Error('امتیاز کلاس «'+name+'» نامعتبر است.');
  cids.add(id);names.add(norm(name));codes.add(norm(code));
  classes.push({id,name,code,type:TK.includes(c.type)?c.type:'general',score,rules:cleanRules(c.rules,gids),active:c.active!==false,note:String(c.note??''),req:!!c.req,valid:validNum(c.valid),hours:hrs(c.hours)});
 }
 const sessions=[],sids=new Set();
 for(const s of r.sessions){
  const id=String(s?.id??''),c=classes.find(x=>x.id===s?.classId);
  if(!id||sids.has(id))throw new Error('شناسه نوبت نامعتبر یا تکراری است.');
  if(!c)throw new Error('یکی از نوبت‌ها به کلاس ناموجود اشاره می‌کند.');
  sids.add(id);let d=normDate(s.date);if(d===null){w.push('تاریخ نامعتبر پاک شد.');d=''}
  let snap=mkSnap(c);
  if(s.snap&&TK.includes(s.snap.type)&&okScore(num(s.snap.score)))snap={type:s.snap.type,score:num(s.snap.score),rules:cleanRules(s.snap.rules,gids),valid:validNum(s.snap.valid),hours:hrs(s.snap.hours)};

const inRange=(s,f)=>!((f.from&&(!s.date||s.date<f.from))||(f.to&&(!s.date||s.date>f.to)));
function pts(p,f={}){
 const o={general:0,semi:0,specific:0,total:0,validTotal:0,count:0,distinct:0,hours:0,items:[]},t=todayC(),dis=new Set();
 for(const s of db.sessions){
  const r=rec(s.id,p.id);if(!r||r.s!=='p'||!isHeld(s))continue;
  if(f.classId&&s.classId!==f.classId)continue;if(!inRange(s,f))continue;
  if(f.groupId&&gOf(r,p.id,f)!==f.groupId)continue;
  o[r.t]+=r.v;o.total+=r.v;o.count++;o.hours+=s.snap.hours||0;dis.add(s.classId);
  const v=s.snap.valid||0;if(!v||!s.date||!t||addMonths(s.date,v)>=t)o.validTotal+=r.v;
  o.items.push({s,r});
 }
 o.distinct=dis.size;
 o.items.sort((a,b)=>(b.s.date||'').localeCompare(a.s.date||''));return o;
}
function ranking(f={},all=false){
 const rows=db.staff.map(p=>({p,...pts(p,f)})).filter(r=>(all||r.p.active||r.count>0)&&(!f.groupId||r.count>0));
 const key=({valid:'validTotal',sessions:'count',courses:'distinct'})[f.sort]||'total';
 rows.sort((a,b)=>b[key]-a[key]||b.total-a.total||a.p.name.localeCompare(b.p.name,'fa'));
 rows.forEach((r,i)=>r.rank=i&&rows[i-1][key]===r[key]?rows[i-1].rank:i+1);return rows;
}

function classModal(c){
 const rules=c?.rules||{},code=c?.code||'CLS-'+String(db.classes.length+1).padStart(3,'0');
 let gr='';
 if(db.groups.length)gr='<h4>قانون هر گروه شغلی</h4><p class="hint">نوع یا امتیاز خالی = مطابق پیش‌فرض بالا.</p><div class="tw"><table style="min-width:0"><tr><th class="l">گروه</th><th>نوع امتیاز</th><th>امتیاز</th><th>اجباری؟</th></tr>'+db.groups.map(g=>'<tr><td class="l">'+esc(g.name)+'</td><td><select name="rt_'+g.id+'">'+typeOpts(rules[g.id]?.type||'','مطابق پیش‌فرض')+'</select></td><td><input name="rs_'+g.id+'" inputmode="decimal" placeholder="پیش‌فرض" value="'+(rules[g.id]&&rules[g.id].score!==''&&rules[g.id].score!=null?fa(rules[g.id].score):'')+'"></td><td><select name="rq_'+g.id+'">'+opts([['','مطابق پیش‌فرض'],['y','اجباری'],['n','اختیاری']],rules[g.id]?.req||'')+'</select></td></tr>').join('')+'</table></div>';
 openModal(c?'ویرایش کلاس':'کلاس جدید','<label>نام کلاس<input name="name" value="'+esc(c?.name||'')+'"></label><label>کد ثابت<input name="code" value="'+esc(code)+'"></label><label>نوع پیش‌فرض<select name="type">'+typeOpts(c?.type||'general')+'</select></label><label>امتیاز پیش‌فرض<input name="score" inputmode="decimal" value="'+fa(c?c.score:10)+'"></label><label>وضعیت پیش‌فرض<select name="req">'+opts([['0','اختیاری'],['1','اجباری']],c?.req?'1':'0')+'</select></label><label>اعتبار آموزش (ماه؛ ۰ = بدون انقضا)<input name="valid" inputmode="numeric" value="'+fa(c?.valid||0)+'"></label><p class="hint">اگر اعتبار تعریف شود، پس از انقضا همان فرد می‌تواند دوباره در این کلاس شرکت کند و امتیاز بگیرد؛ قبل از انقضا ثبت مجدد مسدود است.</p><label>مدت کلاس (ساعت آموزشی؛ ۰ = ثبت نشود)<input name="hours" inputmode="decimal" value="'+fa(c?.hours||0)+'"></label><label>توضیحات<input name="note" value="'+esc(c?.note||'')+'"></label>'+gr,fd=>{
  const name=String(fd.get('name')).trim(),cd=String(fd.get('code')).trim(),type=fd.get('type'),score=num(fd.get('score')),vraw=String(fd.get('valid')||'').trim(),valid=vraw===''?0:num(vraw);
  if(!name)return 'نام کلاس را وارد کنید.';
  if(db.classes.some(x=>x!==c&&norm(x.name)===norm(name)))return 'کلاسی با این نام قبلاً تعریف شده است.';
  if(!cd)return 'کد کلاس را وارد کنید.';
  if(db.classes.some(x=>x!==c&&norm(x.code)===norm(cd)))return 'این کد قبلاً استفاده شده است.';
  if(!TK.includes(type))return 'نوع امتیاز نامعتبر است.';
  if(!okScore(score))return 'امتیاز باید عددی بین ۰ تا ۱۰۰۰ باشد.';
  if(!(valid>=0&&valid<=120))return 'اعتبار باید بین ۰ تا ۱۲۰ ماه باشد.';
  const hv=String(fd.get('hours')||'').trim(),hours=hv===''?0:num(hv);
  if(!(hours>=0&&hours<=1000))return 'مدت کلاس باید عددی بین ۰ تا ۱۰۰۰ ساعت باشد.';
  const nr={};
  for(const g of db.groups){const t=fd.get('rt_'+g.id)||'',sv=String(fd.get('rs_'+g.id)||'').trim(),rq=fd.get('rq_'+g.id)||'';let sc='';if(sv!==''){sc=num(sv);if(!okScore(sc))return 'امتیاز گروه «'+g.name+'» نامعتبر است.'}if(t||sc!==''||rq)nr[g.id]={type:TK.includes(t)?t:'',score:sc,req:rq==='y'||rq==='n'?rq:''}}
  const d={name,code:cd,type,score,rules:nr,note:String(fd.get('note')||'').trim(),req:fd.get('req')==='1',valid:Math.round(valid),hours};
  if(c&&db.sessions.some(s=>s.classId===c.id)&&sigOf(d)!==sigOf(c)&&!confirm('قانون امتیازدهی این کلاس تغییر می‌کند.\nنوبت‌ها و حضورهای قبلی تغییر نمی‌کنند و فقط نوبت‌های جدید با قانون تازه ساخته می‌شوند. ادامه می‌دهید؟'))return 'تغییرات اعمال نشد.';
  if(c){logE('کلاس','ویرایش «'+c.name+'»'+(sigOf(d)!==sigOf(c)?' (قوانین امتیاز تغییر کرد)':''));Object.assign(c,d)}else{db.classes.push({id:uid(),active:true,...d});logE('کلاس','ایجاد «'+name+'»')}
  commit();render();toast('ذخیره شد.');
 },{wide:true});
}
function sessionModal(s,pre){
 const cl=db.classes.filter(c=>c.active||c.id===s?.classId);
 if(!cl.length){toast('ابتدا یک کلاس فعال تعریف کنید.','bad');return}
 const locked=s&&Object.keys(db.att[s.id]||{}).length>0,sel=s?.classId||pre||cl[0].id;
 openModal(s?'ویرایش نوبت':'نوبت جدید','<label>کلاس<select name="classId"'+(locked?' disabled':'')+'>'+opts(cl.map(c=>[c.id,c.name]),sel)+'</select></label>'+(locked?'<p class="hint">کلاس نوبتی که حضور دارد قابل تغییر نیست.</p>':'')+'<label>تاریخ شمسی (می‌تواند آینده باشد)<div class="inl"><input name="date" inputmode="numeric" placeholder="۱۴۰۵/۰۸/۲۴" value="'+(s?fa(s.date):'')+'"><button type="button" class="btn sm" data-act="fillToday">امروز</button></div></label><label>مدرس<input name="instructor" value="'+esc(s?.instructor||'')+'"></label><label class="ck"><input type="checkbox" name="canceled"'+(s?.status==='canceled'?' checked':'')+'>این نوبت لغو شده است (در امتیاز و گزارش‌ها محاسبه نمی‌شود)</label><label>توضیحات<textarea name="note" rows="2">'+esc(s?.note||'')+'</textarea></label>',fd=>{
  const cid=locked?s.classId:fd.get('classId'),d=normDate(fd.get('date'));
  if(!d)return 'تاریخ شمسی معتبر وارد کنید (مثلاً ۱۴۰۵/۰۸/۲۴).';
  if(db.sessions.some(x=>x!==s&&x.classId===cid&&x.date===d))return 'برای این کلاس در همین تاریخ قبلاً نوبت ثبت شده است.';
  const o={classId:cid,date:d,instructor:String(fd.get('instructor')||'').trim(),note:String(fd.get('note')||'').trim(),status:fd.get('canceled')==='on'?'canceled':'auto'};
  if(s&&locked&&s.date!==d&&!confirm('این نوبت دارای ثبت حضور/غیاب است. تغییر تاریخ روی اعتبار دوره و گزارش‌ها اثر می‌گذارد. ادامه می‌دهید؟'))return 'تغییر تاریخ لغو شد.';
  if(s){if(cid!==s.classId)s.snap=mkSnap(cls(cid));Object.assign(s,o);logE('نوبت','ویرایش '+sname(s)+' / '+d)}
  else{const n={id:uid(),...o,snap:mkSnap(cls(cid))};db.sessions.push(n);ui.sid=n.id;logE('نوبت','ایجاد '+sname(n)+' / '+d)}
  commit();render();toast('ذخیره شد.');
 });
}

const hk=x=>norm(String(x??'').replace(/‌/g,' '));
const H_NAME=['نام','نام و نام خانوادگی','نام پرسنل','name'],H_CODE=['کد','کد پرسنلی','شماره پرسنلی','code'],H_GRP=['گروه','گروه شغلی','سمت','group'];
function parseTable(text){
 text=String(text||'').replace(/^﻿/,'');
 const first=text.split(/\r?\n/).find(l=>l.trim())||'';
 const cnt=c=>first.split(c).length-1;
 const delim=cnt('\t')>0?'\t':[',',';','،'].reduce((b,c)=>cnt(c)>cnt(b)?c:b,',');
 const rows=[];let row=[],cell='',q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
  else if(ch==='"'&&cell.trim()==='')q=true;
  else if(ch===delim){row.push(cell);cell=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
  else cell+=ch}
 row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);
 return rows.map(r=>r.map(x=>x.replace(/\s+/g,' ').trim())).slice(0,3000);
}
function planStaff(text){
 const lines=parseTable(text);
 const plan={add:[],skip:[],newGroups:[],headerUsed:false};
 if(!lines.length)return plan;
 let ix={n:0,c:1,g:2},start=0;
 const hs=lines[0].map(hk);
 if(hs.some(h=>H_NAME.includes(h))){plan.headerUsed=true;start=1;ix={n:hs.findIndex(h=>H_NAME.includes(h)),c:hs.findIndex(h=>H_CODE.includes(h)),g:hs.findIndex(h=>H_GRP.includes(h))}}
 const byName=new Map(db.groups.map(g=>[hk(g.name),g])),pending=new Map(),seen=[];
 for(let i=start;i<lines.length;i++){
  const c=lines[i];
  let name=(c[ix.n]||'').trim(),code=ix.c>=0?lat(c[ix.c]||'').trim():'',gn=ix.g>=0?(c[ix.g]||'').trim():'';
  if(!plan.headerUsed&&c.length===2&&byName.has(hk(c[1]))){code='';gn=c[1]}
  if(!name){plan.skip.push({name:'(ردیف '+(i+1)+')',why:'نام خالی'});continue}
  if(db.staff.some(p=>hk(p.name)===hk(name)&&hk(p.code)===hk(code))||seen.some(x=>hk(x.name)===hk(name)&&hk(x.code)===hk(code))){plan.skip.push({name,why:'تکراری'});continue}
  if(code&&(db.staff.some(p=>p.code&&hk(p.code)===hk(code))||seen.some(x=>x.code&&hk(x.code)===hk(code)))){plan.skip.push({name,why:'کد تکراری'});continue}
  if(gn&&!byName.has(hk(gn))&&!pending.has(hk(gn)))pending.set(hk(gn),gn);
  const item={name,code,gn};plan.add.push(item);seen.push(item);
 }
 plan.newGroups=[...pending.values()];return plan;
}
function applyPlan(plan){
 const byName=new Map(db.groups.map(g=>[hk(g.name),g]));
 plan.newGroups.forEach(n=>{if(!byName.has(hk(n))){const g={id:uid(),name:n,min:0};db.groups.push(g);byName.set(hk(n),g)}});
 plan.add.forEach(x=>db.staff.push({id:uid(),name:x.name,code:x.code,groupId:x.gn?(byName.get(hk(x.gn))?.id||''):'',active:true}));
 logE('پرسنل','ورود دسته‌جمعی: '+plan.add.length+' نفر'+(plan.newGroups.length?' / گروه جدید: '+plan.newGroups.join('، '):''));
}
